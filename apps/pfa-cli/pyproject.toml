[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-cli"
version = "0.1.0"
description = "Personal Finance CLI tool"
requires-python = ">=3.12"
dependencies = [
    "pfa-parser>=0.1.0",
    "pfa-ir-consolidator>=0.1.0",
    "pfa-categorize>=0.1.0",
    "pfa-analysis>=0.1.0",
    "click>=8.0",
]

[project.scripts]
pfa = "pfa_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_cli"]
