# txn-categorize — categorization rules
#
# Edit this file (not the Python) to extend or retune categorization.
# Rules are evaluated in order; the first matching rule wins.
# Matching is case- and punctuation-insensitive.
# Keywords are matched as substrings against the transaction description.
#
# ORDERING IS CRITICAL:
#   Specific merchant/brand rules MUST come before generic patterns
#   (e.g. "SWEE HENG" before "Funds Transfer") to prevent mis-classification.
#
# TWO-LEVEL SCHEME:
#   Categories use "Class: Subtype" format. Classes:
#   - Income   (Salary, Bonus, Interest, Dividends, Investment,
#               Cashback, Other)
#   - Expense  (Groceries, Dining, Transport, Utilities, Shopping, Travel,
#               Entertainment, Health, Personal Care, Education, Bank Fees, CW,
#               Tax, Productivity, Other)
#   - Transfer (Internal, External)

categories:
  - "Income: Salary"
  - "Income: Bonus"
  - "Income: Interest"
  - "Income: Dividends"
  - "Income: Investment"
  - "Income: Cashback"
  - "Income: Other"
  - "Expense: Groceries"
  - "Expense: Dining"
  - "Expense: Transport"
  - "Expense: Utilities"
  - "Expense: Shopping"
  - "Expense: Travel"
  - "Expense: Entertainment"
  - "Expense: Health"
  - "Expense: Personal Care"
  - "Expense: Education"
  - "Expense: CW"
  - "Expense: Tax"
  - "Expense: Productivity"
  - "Expense: Bank Fees"
  - "Expense: Other"
  - "Transfer: Internal"
  - "Transfer: External"

rules:
  # =========================================================================
  # INCOME
  # =========================================================================

  # -------------------------------------------------------------------------
  # 1.1 Income: Bonus
  # -------------------------------------------------------------------------
  - category: "Income: Bonus"
    match:
      - BONUS

  # -------------------------------------------------------------------------
  # 1.2 Income: Dividends
  # -------------------------------------------------------------------------
  - category: "Income: Dividends"
    match:
      - DIVIDEND

  # -------------------------------------------------------------------------
  # 1.3 Income: Interest
  # -------------------------------------------------------------------------
  - category: "Income: Interest"
    match:
      - CREDIT INTEREST
      - INTEREST CREDIT
      - INTEREST EARNED
      - INTERESTINT
      - INTEREST
      - SYNTHETIC
      - FIXED DEPOSIT
      - FDWD
      - TIME DEPO AUTO ROLLOVER
      - TIME DEPO

  # -------------------------------------------------------------------------
  # 1.4 Income: Salary
  # -------------------------------------------------------------------------
  - category: "Income: Salary"
    match:
      - SALARY
      - PAYROLL
      - IBG GIRO SALA

  # -------------------------------------------------------------------------
  # 1.5 Income: Cashback
  # -------------------------------------------------------------------------
  - category: "Income: Cashback"
    match:
      - CASH REBATE
      - REBATE

  # =========================================================================
  # EXPENSE
  # =========================================================================

  # -------------------------------------------------------------------------
  # 2.1 Expense: Groceries — supermarkets, specialty grocers, convenience
  # -------------------------------------------------------------------------
  - category: "Expense: Groceries"
    match:
      - NTUC
      - FAIRPRICE
      - COLD STORAGE
      - DON DON DONKI
      - SCARLETT
      - 7-ELEVEN
      - SEVEN-ELEVEN
      - GUSTO
      - SHENG SIONG
      - GIANT
      - FRESH FRUITS
      - MITSUKO
      - HYPERMARKET
      - MARKETPLACE
      - LPI ECO PRIME

  # -------------------------------------------------------------------------
  # 2.2 Expense: Dining — restaurants, cafes, food courts, bakeries, delivery
  #    (must come BEFORE generic Transfer so PAYNOW to eateries is caught)
  # -------------------------------------------------------------------------
  - category: "Expense: Dining"
    match:
      # Fast food
      - MCDO
      - KFC
      - BURGER KING
      - SUBWAY
      - LONG JOHN SILVER
      - MOS BURGER
      - SHAKE SHACK
      # Japanese / Asian chains
      - SUKIYA
      - WOK HEY
      - GUZMAN
      - MODUAMY
      - RAMEN
      - BENTO
      - IPPUDO
      - COCO ICHIBANYA
      - SOUP
      - YAPPARI
      - BUTAHAGE
      - HAWON
      - LEE BAI
      - OMMA CHICKEN
      - CHICKEN SOUP
      # Cafes & bubble tea
      - STARBUCKS
      - KOI
      - MIXUE
      - COMPOSE COFFEE
      - NYLON COFFEE
      - TULLYS COFFEE
      - DAILY CUT
      - TOMOCAFE
      - COFFEE BEAN
      - KOONG WOH TONG
      # Food courts / hawker
      - HAWKER
      - KOPITIAM
      - KOUFU
      - FR JWL
      - FOOD ARENA
      - RFA_FB
      # Bakeries
      - SWEE HENG
      - TOSUTA
      # Western
      - ST LOUIS HIGH STREET
      # Desert
      - 99 OLD TREES DURIAN
      - MESSINA
      # Food delivery
      - FOODPANDA
      - GRABFOOD
      - DELIVEROO
      - ORDER9720

  # -------------------------------------------------------------------------
  # 2.3 Expense: Shopping — retail, online marketplaces, apparel, electronics
  # -------------------------------------------------------------------------
  - category: "Expense: Shopping"
    match:
      # Online marketplaces
      - SHOPEE
      - LAZADA
      - AMAZON
      - SHOPBACK
      # Electronics
      - HARVEY NORMAN
      - COURTS
      - BEST DENKI
      - HONOR
      - APPLE
      # Apparel / accessories
      - HUSH PUPPIES
      - NATURALPROJECT
      - UNIQLO
      - HANDS
      - ISSEY MIYAKE
      - PLANET TRAVELLER
      - NBS UPTOWN
      # Souvenirs
      - BACHA COFFEE
      # Cosmetics / perfumes
      - RU RABO
      # Duty Free
      - LOTTE DUTY FREE
      - SHILLA

  # -------------------------------------------------------------------------
  # 2.4 Expense: Travel — flights, hotels, OTAs, travel activities
  # -------------------------------------------------------------------------
  - category: "Expense: Travel"
    match:
      - KLOOK
      - TRIP.COM
      - AGODA
      - BOOKING.COM
      - AIRASIA
      - SCOOT
      - HOTEL

  # -------------------------------------------------------------------------
  # 2.5 Expense: Entertainment — gaming, streaming, subscriptions, digital content
  # -------------------------------------------------------------------------
  - category: "Expense: Entertainment"
    match:
      - GOOGLE YOUTUBE
      - YOUTUBE PREMIUM
      - STEAMGAMES
      - STEAM PURCHASE
      - GOOGLE GYM
      - GOOGLE ONE
      - NETFLIX
      - SPOTIFY
      - DISNEY
      # Offline
      - RFA MEMBERSHIP

  # -------------------------------------------------------------------------
  # 2.6 Expense: Personal Care — laundry, haircut, beauty services
  # -------------------------------------------------------------------------
  - category: "Expense: Personal Care"
    match:
      - EZ WASH
      - LAUNDRY
      - KCUTS
      - SEPHORA

  # -------------------------------------------------------------------------
  # 2.7 Expense: Health — pharmacies, clinics, hospitals
  # -------------------------------------------------------------------------
  - category: "Expense: Health"
    match:
      - GUARDIAN
      - WATSONS
      - UNITY
      - DOCTOR
      - CLINIC
      - PHARMACY
      - HOSPITAL
      - DENTAL

  # -------------------------------------------------------------------------
  # 2.8 Expense: Productivity — AI/ML services and subscriptions
  # -------------------------------------------------------------------------
  - category: "Expense: Productivity"
    match:
      - CAKEGROWTH
      - GOOGLE CLOUD
      - CENTAURI

  # -------------------------------------------------------------------------
  # 2.9 Expense: Education — tuition, schools, courses, learning subscriptions
  # -------------------------------------------------------------------------
  - category: "Expense: Education"
    match:
      - TUITION
      - TUTOR
      - SCHOOL
      - PRESCHOOL
      - KINDERGARTEN
      - ENRICHMENT
      - ACADEMY
      - UNIVERSITY
      - COLLEGE
      - EDUCATION
      - COURSE
      - LEARNING
      - EDU
      - CFA INSTITUTE

  # -------------------------------------------------------------------------
  # 2.10 Expense: Bank Fees — bank charges, misc debits, FX conversion fees
  # -------------------------------------------------------------------------
  - category: "Expense: Bank Fees"
    match:
      - SERVICE CHARGE
      - ANNUAL FEE
      - LATE FEE
      - ADMIN FEE
      - MONTHLY FEE
      - CCY CONVERSION FEE
      - OD INT CHARGE

  # -------------------------------------------------------------------------
  # 2.11 Expense: Tax — IRAS income tax, GIRO tax deductions
  # -------------------------------------------------------------------------
  - category: "Expense: Tax"
    match:
      - INWARD DR - GIRO TAX
      - IRAS

  # -------------------------------------------------------------------------
  # 2.12 Expense: CW — ATM / over-the-counter cash withdrawals
  # -------------------------------------------------------------------------
  - category: "Expense: CW"
    match:
      - CASH WITHDRAWAL

  # -------------------------------------------------------------------------
  # 2.13 Expense: Transport — public transit, ride-hailing, taxis
  # -------------------------------------------------------------------------
  - category: "Expense: Transport"
    match:
      - BUS/MRT
      - TRANSIT
      - TAXI
      - COMFORT
      - GOJEK
      - GRABPAY
      - GRAB MAKATI

  # -------------------------------------------------------------------------
  # 2.14 Expense: Utilities — electricity, water, telco, town council
  # -------------------------------------------------------------------------
  - category: "Expense: Utilities"
    match:
      - SP SERVICES
      - TOWN COUNCIL
      - PUB
      - SINGTEL
      - STARHUB
      - M1

  # =========================================================================
  # TRANSFER
  # =========================================================================

  # -------------------------------------------------------------------------
  # 3.1 Transfer: External
  #    Internal transfers are detected via IR is_internal_transfer
  #    (pre-classified before rules).  External transfers are auto-detected
  #    by the script AND keyword-matched here.
  #    MUST come AFTER merchant rules so "PAYNOW to SWEE HENG" is caught by
  #    Dining, not Transfer.
  # -------------------------------------------------------------------------
  - category: "Transfer: External"
    match:
      - E-BANKING TRANSFER
      - STANDING INSTRUCTION
      - FUNDS TRANSFER
      - FAST PAYMENT
      - PAYNOW-FAST
      - PAYNOW TRANSFER
      - PAYNOW TO
      - CURRENCY CONVERSION
      - TOP-UP TO PAYLAH
