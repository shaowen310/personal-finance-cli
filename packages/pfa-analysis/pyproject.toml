[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-analysis"
version = "0.1.0"
description = "Personal finance analysis and reporting engine"
requires-python = ">=3.12"
dependencies = [
    "pfa-parser>=0.1.0",
    "pfa-ir-consolidator>=0.1.0",
    "pfa-categorize>=0.1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_analysis"]
