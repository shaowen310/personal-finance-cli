[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-ir-verifier"
version = "0.1.0"
description = "Standalone verification utilities for the personal-finance IR (internal-transfer reconciliation, etc.)"
requires-python = ">=3.12"
dependencies = [
    "pfa-ir-schema>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_ir_verifier"]
