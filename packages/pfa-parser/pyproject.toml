[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-parser"
version = "0.1.0"
description = "Bank statement PDF parser for personal finance analysis (SG banks: DBS, OCBC, UOB, ICBC)"
requires-python = ">=3.12"
dependencies = [
    "pfa-ir-schema>=0.1.0",
    "pfa-ir-verifier>=0.1.0",
    "pdfplumber>=0.11",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_parser"]
