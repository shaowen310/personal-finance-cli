[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-parser"
version = "0.1.0"
description = "Bank statement parser wrapper for personal finance analysis"
requires-python = ">=3.12"
dependencies = [
    "sg-bank-pdf-parser>=0.1.0",
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"
Repository = "https://github.com/shaowen310/sg-bank-pdf-parser"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_parser"]
