[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfa-ir-consolidator"
version = "0.1.0"
description = "IR data consolidation for personal finance analysis"
requires-python = ">=3.12"
dependencies = [
    "pfa-ir-schema>=0.1.0",
    "pfa-parser>=0.1.0",
    "pfa-fx>=0.1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/shaowen310/personal-finance-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pfa_ir_consolidator"]
